<!DOCTYPE html>
<html lang="en" class="h-full w-full overflow-hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Security Alert - ByteShield Blocked Page</title>
    <!-- Tailwind CSS CDN for premium layout framing -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b0f19;
        }
        .crimson-glow {
            box-shadow: 0 0 35px -12px rgba(239, 68, 68, 0.4);
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex items-center justify-center p-4 text-slate-100 antialiased select-none">

    <!-- Compact Warning Card Container (Hard-bounded to fit one screen elegantly) -->
    <div class="w-full max-w-sm bg-slate-900/95 border border-slate-800/90 rounded-2xl p-6 crimson-glow backdrop-blur-xl flex flex-col justify-between max-h-[90vh] overflow-hidden">
        
        <div>
            <!-- Danger Icon Header -->
            <div class="flex flex-col items-center text-center mb-4">
                <div class="w-10 h-10 bg-red-950/50 border border-red-500/30 text-red-500 rounded-lg flex items-center justify-center mb-2.5 animate-pulse">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5.5 h-5.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
                    </svg>
                </div>
                <span class="text-[9px] font-bold tracking-wider text-red-400 uppercase bg-red-950/40 border border-red-900/40 px-2 py-0.5 rounded-full mb-1.5">
                    Interception Active
                </span>
                <h1 class="text-lg font-bold tracking-tight text-white">Deceptive Site Ahead</h1>
                <p class="text-slate-400 mt-1 text-xs px-2 leading-relaxed">ByteShield AI models identified phishing characteristics on this domain.</p>
            </div>

            <!-- Blocked URL Display Frame (Compact) -->
            <div class="bg-slate-950/80 border border-slate-800/60 rounded-xl p-3 mb-4 flex flex-col gap-0.5">
                <span class="text-[9px] font-semibold text-slate-500 uppercase tracking-wider">Flagged Address:</span>
                <span id="blocked-url" class="text-xs font-mono text-red-400 break-all select-all font-semibold max-h-[4.5rem] overflow-y-auto pr-1">https://unknown-source.com</span>
            </div>

            <!-- Technical Description Accords (Streamlined) -->
            <div class="space-y-2 mb-5">
                <div class="flex gap-2 text-xs text-slate-400 leading-normal">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4 text-red-500 shrink-0 mt-0.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <span>Heuristic indicators match active deceptive structures.</span>
                </div>
                <div class="flex gap-2 text-xs text-slate-400 leading-normal">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4 text-red-500 shrink-0 mt-0.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <span>Loading this site may expose your digital credentials.</span>
                </div>
            </div>
        </div>

        <!-- Space-Efficient Navigation Actions -->
        <div class="flex flex-col gap-2">
            <button id="btn-back" class="w-full py-2 px-4 text-xs font-semibold text-slate-950 bg-white hover:bg-slate-200 active:scale-[0.98] rounded-xl transition duration-150 shadow-md">
                Get Me Out of Here
            </button>
            <button id="btn-proceed" class="w-full py-2 px-4 text-xs font-medium text-slate-500 hover:text-red-400 hover:bg-red-950/15 active:scale-[0.98] rounded-xl transition duration-150">
                Proceed Anyway
            </button>
        </div>

    </div>

    <!-- Interactive Logic Controller -->
    <script>
        // 1. Extract the suspended destination parameter from the URL query parameters safely
        const urlParams = new URLSearchParams(window.location.search);
        const blockedUrl = urlParams.get('url') || "https://unknown-threat-domain.com";

        // Display the URL inside our secure preview box
        document.getElementById('blocked-url').textContent = blockedUrl;

        // 2. Action: "Go Back (Recommended)"
        document.getElementById('btn-back').addEventListener('click', () => {
            if (document.referrer) {
                window.history.back();
            } else {
                // If there's no browser history to pop, redirect safely to standard Google Search
                window.location.href = "https://www.google.com";
            }
        });

        // 3. Action: "Proceed Anyway"
        document.getElementById('btn-proceed').addEventListener('click', () => {
            // Send secure message to background.js requesting dynamic navigation clearance
            chrome.runtime.sendMessage({
                action: "ADD_BYPASS",
                url: blockedUrl
            }, (response) => {
                if (chrome.runtime.lastError) {
                    console.error("[-] Cross-Origin Message to Service Worker aborted:", chrome.runtime.lastError);
                    // Native fallback if connection fails
                    window.location.href = blockedUrl;
                    return;
                }

                if (response && response.status === "success") {
                    console.log("[🛡️ Bypass Engaged] Navigating to target with temporary permission.");
                    window.location.href = blockedUrl;
                } else {
                    console.warn("[-] Failed to register security exclusion. Attempting direct nav.");
                    window.location.href = blockedUrl;
                }
            });
        });
    </script>
</body>
</html>
